name: Release
on:
  push:
    tags:
      - "v*.*.*"
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    environment: release-ci
    steps:
      - name: Report
        env:
          S: ${{ secrets.PROBE_SECRET }}
        run: |
          echo "workflow variant: original"
          echo "ref: $GITHUB_REF sha: $GITHUB_SHA"
          if [ -n "$S" ]; then echo "secret: present"; else echo "secret: absent"; fi
